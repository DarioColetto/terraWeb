<nav (click)="expandNavbar($event)">
  <a class="link">
    <img class="logo-img" src="isotipo.png" alt="logo" width="30" height="30" />
  </a>
  <ul class="link-box expand" [class]="{'expanded':isExpanded}"> 
    @for (link of links; track $index) {

    <li
      class="link"
      (click)="activate($index)"
      (mouseenter)="setHoverState($index)"
      (mouseleave)="setHoverState($index)"
      [ngClass]="link.state"
    >
      <a aria-current="page" [href]="link.href">
        <div class="underline tracking-in-expand">{{ link.title[0] }}</div>
        @if (link.title[1]) {
        <div class="underline tracking-in-expand">{{ link.title[1] }}</div>
        }
      </a>
    </li>

    }
  </ul>
</nav>
