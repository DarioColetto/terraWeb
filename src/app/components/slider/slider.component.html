<div class="slider">
  <div class="view">
    <div class="slider-container" [ngClass]="animationState()" >
      @for (slide of SLIDES_; track $index) {
      <div class="slide" >{{slide}}</div>
      }
      

    </div>
  </div>
</div>


<div class="arrow-container">
  <button
    id="left-arrow"
    (click)="onClickHandler(prevSlide)"
    role="button"
    aria-label="prevSlide"
  >
    <app-icon [name]="'leftArrow'" [stroke]="'white'"></app-icon>
  </button>
  <button
    id="right-arrow"
    class="slide-left"
    (click)="onClickHandler( nextSlide)"
    role="button"
    aria-label="nextSlide"
  >
    <app-icon [name]="'rightArrow'" [stroke]="'white'"></app-icon>
  </button>

</div>

<div class="counter">
  <h3>
    <strong>0{{ index + 1 }} </strong> /
  </h3>
  <p>0{{ SLIDES.length }}</p>
</div>
