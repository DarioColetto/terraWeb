
<h1 class="page-title gold-font"></h1>

  <div class="page-subtitle-wrapper">
    <h2 class="page-subtitle white-font">Como funciona</h2>
  </div>
    <p class="description white-font">
      La geotermia es el uso del calor natural de la Tierra para generar energía
      para producir electricidad o para calefaccionar edificios
    </p>
    <app-link-bar (selectedIndex)="renderView($event)"></app-link-bar>
    <div class="card-container">
      @for (card of cardData; track $index) {
        @if (view === $index){
          <div class="card">
            <h4 class="card-title">{{ card.title }}</h4>
            <div class="card-content">
              <img class="card-foto" [src]="card.img" alt="" />
              <div class="card-text">{{ card.content }}</div>
            </div>
          </div>
        }
      }
    </div>
