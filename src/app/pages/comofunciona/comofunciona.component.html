<div @triggerAnimations class="container position-relative p-0">
  
  <app-link-bar class="container p-0" (selectedIndex)="renderView($event)"></app-link-bar>
  
  <div class="card-container postion-asboute top-0 start-0">
    @for (card of cardData; track $index) {
    @if (view === $index){
    <div>

      <div>

        <div @fade class="white-font my-4">{{ card.content }}</div>
      </div>
    </div>
    }
    }
  </div>

  <div class="container-fluid p-0 postion-asboute top-0 start-0">
    @for (video of videoLinks; track $index) {
    @if ($index === view) {

    <video class="video" autoplay>
      <source [src]="video" type="video/mp4">
    </video>


    }
    }

  </div> 
</div>
