
  <!-- <app-link-bar class="container p-0" (selectedIndex)="renderView($event)"></app-link-bar> -->


    @for (card of cardData; track $index) {

    <div class="card flip-card slide-bottom">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <img src="/garden-400.jpg" alt="card" />
          
            <h5
              class="card-title"
            >
              {{ card.title }}
            </h5>
         
        </div>
        <div class="flip-card-back">
          <p class="card-text">{{ card.content }}</p>
        </div>
      </div>
    </div>

    }
