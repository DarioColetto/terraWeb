<div @triggerAnimations>

  <p @fade class="description white-font">
    La geotermia es el uso del calor natural de la Tierra para generar energía
    para producir electricidad o para calefaccionar edificios
  </p>
  <app-link-bar class="menu" (selectedIndex)="renderView($event)"></app-link-bar>
  <div class="card-container">
    @for (card of cardData; track $index) {
    @if (view === $index){
    <div class="card">

      <div class="card-content">

        <div @fade class="card-text">{{ card.content }}</div>
      </div>
    </div>
    }
    }
  </div>

  <div class="video-container">
    @for (video of videoLinks; track $index) {
    @if ($index === view) {

    <video class="video" autoplay>
      <source [src]="video" type="video/mp4">
    </video>


    }
    }

  </div>
</div>
