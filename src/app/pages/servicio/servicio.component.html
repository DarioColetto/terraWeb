<div id="side-1" class="box">
  <h1 class="page-title gold-font" appViewportObserver [title]="'servicio'">
    nuestro servicio
  </h1>

  <div class="page-subtitle-wrapper">
    <h2 class="page-subtitle white-font">Climatización</h2>
    <h2 class="page-subtitle gold-font">residencial y comercial</h2>
  </div>
  
    <p class="description white-font">
      Ofrecemos una alternativa sostenible para calefaccionar,
      refrigerar y obtener agua caliente sanitaria brindando eficiencia
      energética y disminuyendo la emisión de CO2 al
      planeta.
    </p>
    <app-link-bar (selectedIndex)="renderView($event)"></app-link-bar>
      <div class="menu-view">
        @switch (view) {
          @case (0) {
            <app-servicio-items @fade></app-servicio-items>
          }
          @case (1) {
            <app-comofunciona @fade></app-comofunciona>
          }
          @case (2) {
            <app-descubri @fade></app-descubri>
          }
        }
      </div>
    </div>



<div id="side-2" class="box">
  <app-slider></app-slider>
</div>
